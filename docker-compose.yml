version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: farmtrace-backend:latest
    container_name: farmtrace_backend
    ports:
      - "5002:5002"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5002
    restart: unless-stopped
    networks:
      - farmtrace-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: farmtrace-frontend:latest
    container_name: farmtrace_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - farmtrace-network

networks:
  farmtrace-network:
    driver: bridge
