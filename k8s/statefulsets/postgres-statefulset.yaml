apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: farmtrace
spec:
  serviceName: "postgres-service"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "farmtrace"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: farmtrace-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: "farmtrace"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
