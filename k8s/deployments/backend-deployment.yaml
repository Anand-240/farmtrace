apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: farmtrace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: farmtrace-backend:latest
        ports:
        - containerPort: 4000
        envFrom:
        - configMapRef:
            name: farmtrace-config
        - secretRef:
            name: farmtrace-secrets
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 4000
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
